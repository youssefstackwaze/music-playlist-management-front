<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Music Library</h2>

  <div class="d-flex gap-2">
    <button
      class="btn btn-outline-secondary"
      (click)="importCsv()"
      [disabled]="importing">
      {{ importing ? 'Importing...' : 'Import CSV' }}
    </button>

    <a routerLink="/songs/new" class="btn btn-primary">
      + Add Song
    </a>
  </div>
</div>

<!-- Search bar -->
<div class="row g-2 mb-4">
  <div class="col-auto">
    <select class="form-select" [(ngModel)]="searchType" name="searchType">
      <option value="artist">By artist</option>
      <option value="genre">By genre</option>
    </select>
  </div>
  <div class="col">
    <input
      type="text"
      class="form-control"
      placeholder="Search..."
      name="searchTerm"
      [(ngModel)]="searchTerm"
      (keyup.enter)="search()">
  </div>
  <div class="col-auto">
    <button class="btn btn-primary" (click)="search()">Search</button>
    <button class="btn btn-link" (click)="clearSearch()">Clear</button>
  </div>
</div>

<div *ngIf="loading" class="text-center">
  Loading songs...
</div>

<div *ngIf="errorMessage" class="alert alert-danger">
  {{ errorMessage }}
</div>

<div *ngIf="infoMessage" class="alert alert-success">
  {{ infoMessage }}
</div>

<div class="row" *ngIf="!loading">

  <div class="col-md-4 mb-4" *ngFor="let song of songs">

    <div class="card shadow-sm h-100">
      <div class="card-body">

        <h5 class="card-title">{{ song.title }}</h5>

        <p class="card-text">
          <strong>Artist:</strong> {{ song.artist }}
        </p>

        <p class="card-text">
          <strong>Genre:</strong> {{ song.genre }}
        </p>

        <p class="card-text">
          <strong>Duration:</strong> {{ song.duration }} seconds
        </p>

        <div class="d-flex gap-2">

          <a
            [routerLink]="['/songs/edit', song.id]"
            class="btn btn-warning btn-sm">
            Edit
          </a>

          <button
            class="btn btn-danger btn-sm"
            (click)="deleteSong(song.id)">
            Delete
          </button>

        </div>

      </div>
    </div>

  </div>

</div>

<div *ngIf="!loading && songs.length === 0" class="alert alert-info">
  No songs found. Add your first song!
</div>
